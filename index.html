<!DOCTYPE html>
<html>
<head>
    <title>My Character Gacha</title>
</head>

<body>

    <h1>My Character Gacha</h1>

    <button id="rollButton">Roll Character</button>

    <div id="characterArea">
        <p>Press Roll Character!</p>
    </div>

<script>

// -------------------------
// CHARACTER DATABASE
// -------------------------

const characters = [];

for (let i = 1; i <= 100; i++) {
    characters.push({
        id: i,
        name: "Character " + i
    });
}


// -------------------------
// CLAIMED CHARACTERS
// -------------------------

let claimedCharacters =
    JSON.parse(localStorage.getItem("claimedCharacters")) || [];


// -------------------------
// CURRENT ROLL
// -------------------------

let currentCharacter = null;


// -------------------------
// ROLL FUNCTION
// -------------------------

function rollCharacter() {

    const randomNumber =
        Math.floor(Math.random() * characters.length);

    currentCharacter = characters[randomNumber];

    showCharacter();
}


// -------------------------
// DISPLAY CHARACTER
// -------------------------

function showCharacter() {

    const characterArea =
        document.getElementById("characterArea");

    const alreadyClaimed =
        claimedCharacters.includes(currentCharacter.id);

    characterArea.innerHTML = `
        <h2>${currentCharacter.name}</h2>
        <p>ID: ${currentCharacter.id}</p>

        ${
            alreadyClaimed
            ? "<p>Already claimed!</p>"
            : '<button onclick="claimCharacter()">Claim</button>'
        }
    `;
}


// -------------------------
// CLAIM FUNCTION
// -------------------------

function claimCharacter() {

    if (!currentCharacter) {
        return;
    }

    if (!claimedCharacters.includes(currentCharacter.id)) {

        claimedCharacters.push(currentCharacter.id);

        localStorage.setItem(
            "claimedCharacters",
            JSON.stringify(claimedCharacters)
        );
    }

    showCharacter();
}


// -------------------------
// BUTTON CONNECTION
// -------------------------

document
    .getElementById("rollButton")
    .addEventListener("click", rollCharacter);

</script>

</body>
</html>
